name: refresh profile graphics

# No `push` trigger on purpose: this job commits into the repo, and a push
# trigger would make it re-run on its own commit.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Draw the graphics
        env:
          # The default token can read this account's contribution calendar,
          # including the private-contribution count when the account has
          # "include private contributions" switched on in profile settings.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate.py

      - name: Commit only what changed
        run: |
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets
          git commit -m "assets: refresh profile graphics"
          git push
